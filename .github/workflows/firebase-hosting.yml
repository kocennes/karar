name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-deploy-web:
    name: Build & Deploy Web (Firebase)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required for PR preview channel comment

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Same defines as the live build (scripts/deploy-web.ps1). Without them the
      # app compiles against mock data (USE_REMOTE_API=false) and localhost:5088.
      - name: Build Flutter web
        env:
          API_BASE_URL: https://karar-oq5t.onrender.com
          WEB_VAPID_KEY: ${{ vars.WEB_VAPID_KEY }}
        run: |
          flutter build web --release \
            --no-wasm-dry-run \
            --dart-define=USE_REMOTE_API=true \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=WEB_VAPID_KEY="$WEB_VAPID_KEY"

      # Without the service account secret (not configured yet, or Dependabot/fork
      # PRs) the build is still verified and the deploy steps are skipped.
      - name: Check Firebase deploy credentials
        id: firebase-sa
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JUDGE_APP_KARAR }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JUDGE_APP_KARAR not configured — web build verified, deploy skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # PR: deploy to an isolated preview channel (expires after 7 days)
      - name: Deploy preview channel (PR)
        if: github.event_name == 'pull_request' && steps.firebase-sa.outputs.configured == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JUDGE_APP_KARAR }}
          projectId: judge-app-karar
          target: app
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

      # main merge: deploy to live channel
      - name: Deploy to production (live)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.firebase-sa.outputs.configured == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JUDGE_APP_KARAR }}
          projectId: judge-app-karar
          target: app
          channelId: live

      # SPA smoke test: verify the live URL returns HTTP 200 and index.html content
      - name: SPA rewrite smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.firebase-sa.outputs.configured == 'true'
        run: |
          echo "Waiting 15s for propagation..."
          sleep 15
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://judge-app-karar.web.app)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ SPA smoke test failed: expected 200, got $STATUS"
            exit 1
          fi
          # Verify SPA rewrite is in place — root should return HTML
          BODY=$(curl -s --max-time 10 https://judge-app-karar.web.app)
          if ! echo "$BODY" | grep -qi "<!DOCTYPE html>"; then
            echo "❌ Response body does not contain HTML document root"
            exit 1
          fi
          echo "✅ SPA smoke test passed (HTTP 200, HTML content verified)"
